spring:
  application:
    name: agente-de-pedidos

  datasource:
    url: jdbc:h2:mem:pedidos
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # Aula 1 · configuração do Spring AI
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          # Atendimento quer resposta previsível, não criativa.
          temperature: 0.2
